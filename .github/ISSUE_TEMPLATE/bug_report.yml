name: Bug report
description: Report a reproducible Regionwright problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you for taking the time to report a problem. Please do not include passwords or private game information."
  - type: input
    id: version
    attributes:
      label: Regionwright version and edition
      placeholder: "Free 0.1.1"
    validations:
      required: true
  - type: input
    id: foundry
    attributes:
      label: Foundry VTT version
      placeholder: "v14"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Game system and version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat the problem
      placeholder: "1. Open ...\n2. Choose ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Other enabled modules and screenshots
